<section id="tab-agenda" class="tab-content hidden space-y-5">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Agenda de Citas</h2>
      <p class="text-xs text-gray-500 dark:text-gray-400">Calendario mensual: haga clic en una cita para editarla o eliminarla</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button onclick="imprimirAgenda()" class="inline-flex items-center gap-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2.5 rounded-xl text-xs font-semibold transition" title="Imprime el calendario del mes que está viendo; en el cuadro de impresión elija «Guardar como PDF»">
        <i class="fa-solid fa-file-pdf"></i> Imprimir / PDF
      </button>
      <button onclick="abrirModalEstados()" class="inline-flex items-center gap-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2.5 rounded-xl text-xs font-semibold transition">
        <i class="fa-solid fa-palette"></i> Estados y colores
      </button>
      <button id="btnAnadirCita" onclick="abrirModalCita()" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-md transition">
        <i class="fa-solid fa-plus"></i> Añadir cita
      </button>
    </div>
  </div>

  <div id="agendaImprimible" class="bg-white dark:bg-cardbg rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm p-4 sm:p-6">
    <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
      <h3 id="agendaTitulo" class="font-serif text-3xl sm:text-4xl text-amber-800 dark:text-amber-300">&nbsp;</h3>
      <div class="flex items-center gap-1 no-print-agenda">
        <button onclick="agendaCambiarMes(-1)" class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition" title="Mes anterior" aria-label="Mes anterior"><i class="fa-solid fa-chevron-left"></i></button>
        <button onclick="agendaIrAHoy()" class="px-3 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-semibold transition">Hoy</button>
        <button onclick="agendaCambiarMes(1)" class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition" title="Mes siguiente" aria-label="Mes siguiente"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>

    <div class="no-print-agenda flex flex-wrap items-end gap-3 mb-4 rounded-xl bg-gray-50 dark:bg-gray-800/50 p-3">
      <div>
        <label for="agFiltroPersona" class="block text-[10px] font-semibold text-gray-500 dark:text-gray-400 mb-1"><i class="fa-solid fa-user"></i> Persona</label>
        <select id="agFiltroPersona" onchange="aplicarFiltrosAgenda()" class="px-3 py-2 text-xs font-semibold bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white"></select>
      </div>
      <div>
        <label for="agFiltroEstado" class="block text-[10px] font-semibold text-gray-500 dark:text-gray-400 mb-1"><i class="fa-solid fa-tag"></i> Estado</label>
        <select id="agFiltroEstado" onchange="aplicarFiltrosAgenda()" class="px-3 py-2 text-xs font-semibold bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white"></select>
      </div>
      <button onclick="limpiarFiltrosAgenda()" class="px-3 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-xs font-semibold rounded-xl transition">Limpiar filtros</button>
      <p id="agFiltroResumen" class="text-[11px] text-gray-500 dark:text-gray-400 ml-auto"></p>
    </div>
    <p id="agFiltroImpresion" class="solo-impresion text-xs text-gray-600 mb-2"></p>

    <div id="agendaLeyenda" class="flex flex-wrap gap-2 mb-4 text-[11px]"></div>

    <div class="overflow-x-auto">
      <div class="min-w-[760px]">
        <div id="agendaDiasSemana" class="grid grid-cols-7 border-b border-amber-800/40 dark:border-amber-300/30 text-sm text-amber-800 dark:text-amber-300 pb-1"></div>
        <div id="agendaGrid" class="grid grid-cols-7"></div>
      </div>
    </div>
    <p id="agendaError" class="hidden mt-3 text-xs text-red-600"></p>
  </div>

  <!-- Ventana emergente de una cita (editar / eliminar) -->
  <div id="agendaPopover" class="hidden fixed z-[60] w-72 bg-white dark:bg-cardbg rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 p-4 space-y-3" role="dialog" aria-label="Detalle de la cita"></div>

  <!-- Modal de cita -->
  <div id="modalCita" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="citaTitulo">
    <form id="formCita" onsubmit="guardarCita(event)" class="bg-white dark:bg-cardbg rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h3 id="citaTitulo" class="text-lg font-bold text-gray-900 dark:text-white">Nueva cita</h3>
        <button type="button" onclick="cerrarModalCita()" class="text-gray-400 hover:text-gray-600 dark:hover:text-white" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="hidden" id="citaId">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1" for="citaFecha">Fecha</label><input id="citaFecha" type="date" required class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white"></div>
        <div><label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1" for="citaHora">Hora <span class="font-normal text-gray-400">(opcional)</span></label><input id="citaHora" type="time" class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white"></div>
      </div>
      <div><label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1" for="citaCliente">Cliente o título</label><input id="citaCliente" type="text" required maxlength="120" placeholder="Ej: Lucía Hurtado" class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white"></div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1" for="citaServicio">Servicio <span class="font-normal text-gray-400">(opcional)</span></label>
        <input id="citaServicio" type="text" list="citaServiciosLista" maxlength="80" placeholder="Ej: Keratina" class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
        <datalist id="citaServiciosLista"><option value="Keratina"></option><option value="Hidratación"></option><option value="Diagnóstico"></option><option value="Despunte"></option><option value="Capacitación"></option></datalist>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1" for="citaEstado">Estado</label>
        <div class="flex items-center gap-2">
          <span id="citaEstadoPunto" class="w-5 h-5 rounded-full border border-black/10 shrink-0"></span>
          <select id="citaEstado" onchange="actualizarPuntoEstado()" class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white"></select>
        </div>
      </div>
      <fieldset>
        <legend class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Con quién es la cita <span class="font-normal text-gray-400">(puede marcar varias)</span></legend>
        <div id="citaResponsables" class="grid grid-cols-2 gap-x-3 gap-y-1.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 max-h-40 overflow-y-auto"></div>
      </fieldset>
      <div><label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1" for="citaNotas">Notas <span class="font-normal text-gray-400">(opcional)</span></label><textarea id="citaNotas" rows="2" maxlength="500" class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white"></textarea></div>
      <p id="citaError" class="hidden text-xs text-red-600"></p>
      <div class="flex justify-end gap-2">
        <button type="button" onclick="cerrarModalCita()" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-xs font-semibold rounded-xl transition">Cancelar</button>
        <button id="citaGuardar" type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold rounded-xl shadow transition">Guardar</button>
      </div>
    </form>
  </div>

  <!-- Modal de estados -->
  <div id="modalEstados" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="estadosTitulo">
    <div class="bg-white dark:bg-cardbg rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h3 id="estadosTitulo" class="text-lg font-bold text-gray-900 dark:text-white">Estados de las citas</h3>
        <button type="button" onclick="cerrarModalEstados()" class="text-gray-400 hover:text-gray-600 dark:hover:text-white" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <ul id="estadosLista" class="space-y-2"></ul>
      <form id="formEstado" onsubmit="guardarEstado(event)" class="rounded-xl border border-gray-100 dark:border-gray-700 p-3 space-y-3 bg-gray-50/70 dark:bg-gray-800/40">
        <p id="estadoFormTitulo" class="text-xs font-bold text-gray-700 dark:text-gray-200">Nuevo estado</p>
        <input type="hidden" id="estadoId">
        <div class="grid grid-cols-[1fr_auto] gap-3 items-end">
          <div><label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1" for="estadoNombre">Nombre</label><input id="estadoNombre" type="text" required maxlength="40" placeholder="Ej: Confirmada" class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white"></div>
          <div><label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1" for="estadoColor">Color</label><input id="estadoColor" type="color" value="#92D050" class="h-10 w-14 p-1 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 cursor-pointer"></div>
        </div>
        <div id="estadoPaleta" class="flex flex-wrap gap-2" aria-label="Colores sugeridos"></div>
        <p id="estadoError" class="hidden text-xs text-red-600"></p>
        <div class="flex justify-end gap-2">
          <button id="estadoCancelar" type="button" onclick="resetFormEstado()" class="hidden px-3 py-2 bg-gray-200 dark:bg-gray-700 text-xs font-semibold rounded-xl">Cancelar edición</button>
          <button id="estadoGuardar" type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold rounded-xl shadow transition">Agregar estado</button>
        </div>
      </form>
    </div>
  </div>
</section>
