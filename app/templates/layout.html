<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión & POS - Keratinas & Hidrataciones by Erika</title>
  <script src="{{ url_for('static', filename='vendor/tailwind/tailwind.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
  <script src="{{ url_for('static', filename='vendor/chartjs/chart.min.js') }}"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 900: '#831843', 950: '#500724' },
            darkbg: '#0f172a', cardbg: '#1e293b'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body
  class="bg-gray-50 text-gray-800 dark:bg-darkbg dark:text-gray-100 h-screen overflow-hidden flex flex-col font-sans transition-colors duration-200">

  <header
    class="bg-white dark:bg-cardbg border-b border-gray-200 dark:border-gray-800 px-6 py-3 flex flex-wrap justify-between items-center shrink-0 z-30 shadow-sm gap-2">
    <div class="flex items-center space-x-3">
      <button class="md:hidden p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition" onclick="toggleMobileMenu()"><i class="fa-solid fa-bars"></i></button>
      <img src="{{ url_for('static', filename='img/logo_erika.png') }}" alt="Logo Erika"
        class="w-11 h-11 rounded-full object-cover shadow-md border border-brand-500">
      <div>
        <h1 class="font-bold text-base leading-tight tracking-wide text-gray-900 dark:text-white">Keratinas &
          Hidrataciones</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400">By Erika</p>
      </div>
    </div>
    <div class="flex items-center space-x-2 md:space-x-4">
      <div
        class="bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2">
        <i class="fa-solid fa-database"></i><span>SQLite Conectado</span>
      </div>
      <div
        class="bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 dark:text-gray-300 flex items-center gap-2">
        <i class="fa-regular fa-calendar-check text-brand-500"></i><span id="currentDateDisplay">--/--/----</span>
      </div>
      <button onclick="toggleDarkMode()"
        class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
        <i class="fa-solid fa-moon dark:hidden"></i><i class="fa-solid fa-sun hidden dark:inline"></i>
      </button>
    </div>
  </header>
<div id="mobileMenu" class="fixed inset-0 bg-white dark:bg-darkbg z-50 overflow-y-auto p-6 hidden">
  <button class="absolute top-4 right-4 p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition" onclick="toggleMobileMenu()">
    <i class="fa-solid fa-xmark text-lg"></i>
  </button>
  <nav class="space-y-2 mt-12">
    <button onclick="switchTab('caja'); cargarResumenCaja(); toggleMobileMenu();" id="nav-caja" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-cash-register w-5 text-left text-brand-500"></i><span class="text-right font-bold text-brand-600 dark:text-brand-400">Cuadre de Caja</span>
    </button>
    <button onclick="switchTab('dashboard'); toggleMobileMenu();" id="nav-dashboard" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm transition text-brand-600 bg-brand-50 dark:bg-brand-900/30 dark:text-brand-500 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-chart-pie w-5 text-left"></i><span class="text-right">Dashboard General</span>
    </button>
    <button onclick="switchTab('servicios'); toggleMobileMenu();" id="nav-servicios" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-spa w-5 text-left"></i><span class="text-right">Registro Servicios</span>
    </button>
    <button onclick="switchTab('productos'); toggleMobileMenu();" id="nav-productos" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-bag-shopping w-5 text-left"></i><span class="text-right">Venta Productos</span>
    </button>
    <button onclick="switchTab('gestion-productos'); toggleMobileMenu();" id="nav-gestion-productos" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-boxes-stacked w-5 text-left"></i><span class="text-right">Gestión de Productos</span>
    </button>
    <button onclick="switchTab('combos'); cargarCombos(); toggleMobileMenu();" id="nav-combos" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-boxes-packing w-5 text-left"></i><span class="text-right">Gestión de Combos</span>
    </button>
    <button onclick="switchTab('auxiliares'); cargarAuxiliares(); toggleMobileMenu();" id="nav-auxiliares" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-users-gear w-5 text-left"></i><span class="text-right">Auxiliares</span>
    </button>
    <button onclick="switchTab('nomina'); cargarNomina(); toggleMobileMenu();" id="nav-nomina" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-money-check-dollar w-5 text-left"></i><span class="text-right">Nómina</span>
    </button>
    <button onclick="switchTab('inversionistas'); cargarInversionistas(); toggleMobileMenu();" id="nav-inversionistas" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-hand-holding-dollar w-5 text-left"></i><span class="text-right">Inversionistas</span>
    </button>
    <button onclick="switchTab('agenda'); cargarAgenda(); toggleMobileMenu();" id="nav-agenda" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-calendar-days w-5 text-left"></i><span class="text-right">Agenda de Citas</span>
    </button>
    <button onclick="switchTab('historico'); cargarHistorico(1); toggleMobileMenu();" id="nav-historico" class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
      <i class="fa-solid fa-clock-rotate-left w-5 text-left"></i><span class="text-right">Histórico de Ventas</span>
    </button>
  </nav>
</div>

  <div id="appShell" class="flex flex-1 min-h-0 overflow-hidden">
    <aside class="hidden md:block w-16 group hover:w-60 xl:hover:w-64 bg-white dark:bg-cardbg border-r border-gray-200 dark:border-gray-800 flex flex-col shrink-0 h-full min-h-0 overflow-hidden relative transition-all duration-300">
      <nav class="p-3.5 space-y-1.5 flex-1 min-h-0 overflow-y-auto overflow-x-hidden">
        <button onclick="switchTab('caja'); cargarResumenCaja();" id="nav-caja"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-cash-register w-5 text-left text-brand-500"></i><span class="text-right font-bold text-brand-600 dark:text-brand-400 opacity-0 group-hover:opacity-100 transition-opacity duration-300">Cuadre de Caja</span>
        </button>
        <button onclick="switchTab('dashboard')" id="nav-dashboard"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm transition text-brand-600 bg-brand-50 dark:bg-brand-900/30 dark:text-brand-500 hover:bg-gray-100 dark:hover:bg-gray-800">
          <i class="fa-solid fa-chart-pie w-5 text-left"></i><span class="text-right opacity-0 group-hover:opacity-100 transition-opacity duration-300">Dashboard General</span>
        </button>
        <button onclick="switchTab('servicios')" id="nav-servicios"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-spa w-5 text-left"></i><span class="text-right opacity-0 group-hover:opacity-100 transition-opacity duration-300">Registro Servicios</span>
        </button>
        <button onclick="switchTab('productos')" id="nav-productos"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-bag-shopping w-5 text-left"></i><span class="text-right opacity-0 group-hover:opacity-100 transition-opacity duration-300">Venta Productos</span>
        </button>
        <button onclick="switchTab('gestion-productos')" id="nav-gestion-productos"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-boxes-stacked w-5 text-left"></i><span class="text-right opacity-0 group-hover:opacity-100 transition-opacity duration-300">Gestión de Productos</span>
        </button>
        <button onclick="switchTab('combos'); cargarCombos();" id="nav-combos"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-boxes-packing w-5 text-left"></i><span class="text-right opacity-0 group-hover:opacity-100 transition-opacity duration-300">Gestión de Combos</span>
        </button>
        <button onclick="switchTab('auxiliares'); cargarAuxiliares();" id="nav-auxiliares"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-users-gear w-5 text-left"></i><span class="text-right opacity-0 group-hover:opacity-100 transition-opacity duration-300">Auxiliares</span>
        </button>
        <button onclick="switchTab('nomina'); cargarNomina();" id="nav-nomina"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-money-check-dollar w-5 text-left"></i><span class="text-right opacity-0 group-hover:opacity-100 transition-opacity duration-300">Nómina</span>
        </button>
        <button onclick="switchTab('inversionistas'); cargarInversionistas();" id="nav-inversionistas"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-hand-holding-dollar w-5 text-left"></i><span class="text-right opacity-0 group-hover:opacity-100 transition-opacity duration-300">Inversionistas</span>
        </button>
        <button onclick="switchTab('agenda'); cargarAgenda();" id="nav-agenda"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-calendar-days w-5 text-left"></i><span class="text-right opacity-0 group-hover:opacity-100 transition-opacity duration-300">Agenda de Citas</span>
        </button>
        <button onclick="switchTab('historico'); cargarHistorico(1);" id="nav-historico"
          class="nav-btn w-full h-11 flex items-center justify-between px-4 rounded-xl font-medium text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-clock-rotate-left w-5 text-left"></i><span class="text-right opacity-0 group-hover:opacity-100 transition-opacity duration-300">Histórico de Ventas</span>
        </button>
      </nav>
      <div class="border-t border-gray-200 dark:border-gray-800 shrink-0 bg-white dark:bg-cardbg sticky bottom-0 z-20">
        <div class="bg-gray-50 dark:bg-gray-800/60 rounded-xl p-3 flex items-center space-x-0 group-hover:space-x-2 min-w-0 overflow-hidden relative">
          <div class="w-8 h-8 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold text-xs">
            AD</div>
          <div class="hidden group-hover:flex flex-col ml-2">
            <p class="text-xs font-semibold truncate whitespace-nowrap text-gray-900 dark:text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300">Administradora</p>
            <p class="text-[10px] text-gray-500 dark:text-gray-400 truncate opacity-0 group-hover:opacity-100 transition-opacity duration-300">Turno Principal</p>
          </div>
        </div>
      </div>
    </aside>

    <main class="flex-1 min-w-0 h-full overflow-y-auto p-4 sm:p-6 bg-gray-50 dark:bg-darkbg">
      <div id="notificationAlert"
        class="hidden mb-6 p-4 rounded-xl shadow-md border flex items-center justify-between transition-all">
        <div class="flex items-center space-x-3">
          <i id="notifIcon" class="fa-solid text-lg"></i><span id="notifText" class="text-sm font-medium"></span>
        </div>
        <button onclick="closeNotification()" class="text-gray-400 hover:text-gray-600 dark:hover:text-white"><i
            class="fa-solid fa-xmark"></i></button>
      </div>

      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/servicios.js') }}"></script>
  <script src="{{ url_for('static', filename='js/productos.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auxiliares.js') }}"></script>
  <script src="{{ url_for('static', filename='js/nomina.js') }}"></script>
  <script src="{{ url_for('static', filename='js/inversionistas.js') }}"></script>
  <script src="{{ url_for('static', filename='js/combos.js') }}"></script>
  <script src="{{ url_for('static', filename='js/agenda.js') }}"></script>
  <script src="{{ url_for('static', filename='js/caja.js') }}"></script>
  <script>
    function toggleMobileMenu(){
      const menu = document.getElementById('mobileMenu');
      if(menu){ menu.classList.toggle('hidden'); }
    }
  </script>

</body>

</html>
